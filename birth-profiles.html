<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 사주 보관함 | 쭈쌤의 사주전쟁</title><link rel="icon" href="/assets/sajuwar-mark.svg"><link rel="stylesheet" href="/commerce.css"><link rel="stylesheet" href="/birth-profiles.css"></head><body><main class="commerce-shell"><header class="commerce-header"><a class="brand" href="/"><img src="/assets/sajuwar-mark.svg" alt="">쭈쌤의 사주전쟁</a><a class="back" href="/mypage.html">내 작전실</a></header><div class="commerce-body">
<p class="eyebrow">MY BIRTH PROFILES</p><h1>내 사주 보관함</h1><p class="muted">나와 소중한 사람들의 사주를 저장하고, 다시 입력할 필요 없이 불러오세요.</p><p id="message" class="form-message" role="status" aria-live="polite"></p>
<div id="authGate" class="auth-notice" hidden><strong>로그인하면 사주를 저장할 수 있어요</strong><a class="button" id="loginLink" href="/login.html?return=/birth-profiles.html">로그인하고 시작하기</a></div>
<section id="profileContent" hidden><button type="button" class="button card" id="addProfile">＋ 새로운 사주 추가</button><div id="profileList" class="profile-list"></div>
<form id="profileForm" hidden><div class="profile-section"><h2 id="formTitle">새로운 사주 추가</h2><label class="field" for="profileName"><span class="section-label">이름</span><input id="profileName" maxlength="60" autocomplete="off" placeholder="이름 또는 별명" required></label></div>
<div class="profile-section"><span class="section-label" id="relationLabel">관계</span><div class="choice-group" id="relationGroup" role="group" aria-labelledby="relationLabel"><button type="button" data-relation="본인" aria-pressed="true">본인</button><button type="button" data-relation="배우자" aria-pressed="false">배우자</button><button type="button" data-relation="연인" aria-pressed="false">연인</button><button type="button" data-relation="부모" aria-pressed="false">부모</button><button type="button" data-relation="자녀" aria-pressed="false">자녀</button><button type="button" data-relation="친구" aria-pressed="false">친구</button><button type="button" data-relation="직접 입력" aria-pressed="false">직접 입력</button></div><label class="field" id="customRelationField" hidden>관계 직접 입력<input id="customRelation" maxlength="30" placeholder="예: 동료, 형제자매"></label></div>
<div class="profile-section"><label class="field" for="profileBirth"><span class="section-label">생년월일</span><input id="profileBirth" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" required></label><div class="choice-group" id="calendarGroup" role="group" aria-label="양력 또는 음력"><button type="button" data-calendar="solar" aria-pressed="true">양력</button><button type="button" data-calendar="lunar" aria-pressed="false">음력</button></div></div>
<div class="profile-section"><span class="section-label" id="genderLabel">성별</span><div class="choice-group" id="genderGroup" role="group" aria-labelledby="genderLabel"><button type="button" data-gender="female" aria-pressed="false">여성</button><button type="button" data-gender="male" aria-pressed="false">남성</button></div></div>
<div class="profile-section"><label class="field" for="profileTime"><span class="section-label">태어난 시간</span><input id="profileTime" type="time" required></label><label class="consent"><input id="profileTimeUnknown" type="checkbox"><span>태어난 시간을 몰라요</span></label><label class="field">출생 국가<select id="profileCountry"><option value="KR">대한민국</option><option value="US">미국</option><option value="JP">일본</option><option value="CN">중국</option><option value="CA">캐나다</option><option value="AU">호주</option><option value="GB">영국</option><option value="SG">싱가포르</option><option value="VN">베트남</option><option value="TH">태국</option><option value="PH">필리핀</option><option value="OTHER">기타 국가</option></select></label><label class="field">출생 지역<input id="profileRegion" value="서울" maxlength="60" required placeholder="예: 서울, 부산"></label></div>
<p class="profile-help">다른 사람의 정보는 저장에 동의한 경우에 등록해주세요. 사주 저장은 리포트 구매와 별도이며, 이미 생성한 리포트의 분석 대상은 바뀌지 않습니다.</p><p id="formMessage" class="form-message" role="status" aria-live="polite"></p><div class="form-actions"><button class="button secondary" type="button" id="cancelEdit">취소</button><button class="button card" type="submit" id="saveProfile">저장하기</button></div></form></section>
<nav class="legal-links"><a href="/">홈</a><a href="/privacy">개인정보처리방침</a><a href="/support">문의</a></nav></div></main><script src="/site-core.js"></script><script src="/birth-profiles-client.js" defer></script></body></html>
