metadata:
  id: "case_0019"
  source: "검증 상담 사례"
  case_number: 19
  title: "정유년 표현력 상승이 새로운 연애로 이어진 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "partially_outcome_verified"
  review_status: "human_reviewed"
pattern:
  gender: "남성"
  pillars: { hour: "戊辰", day: "甲午", month: "甲午", year: "丙寅" }
  sewoon: { current: "丁酉" }
  domain: "새로운 연애·표현력·관계 지속성"
actual_event:
  before: "자신감과 표현력이 좋아지고 외모와 옷차림에 변화를 줬다."
  decision: "호감 있는 여성에게 적극적이고 세심하게 다가갔다."
  after: "새로운 연애가 시작됐으나 장기 연애나 결혼으로 이어졌는지는 미확인이다."
judgment:
  primary_question: "만남의 성사와 장기적인 관계 안정성을 분리한다."
  evidence_chain:
    - { signal: "정화 식상", interpretation: "표현력·자신감·매력이 밖으로 드러나는 흐름을 본다." }
    - { signal: "식상생재", interpretation: "다정한 표현이 실제 이성 관계로 이어지는지 본다." }
    - { signal: "진유합", interpretation: "재성의 인연이 생활 영역과 연결되는 흐름을 본다." }
    - { signal: "오화와 유금의 자극", interpretation: "일상에 새로운 설렘과 관계 변수가 생기는지 본다." }
consultation:
  recommended_actions: ["호감 표현", "행동으로 신뢰 형성", "가치관 확인", "관계 속도 조절", "경제적 경계 유지"]
  avoid: ["강한 끌림만으로 결혼 판단", "초반 과도한 경제 지원", "외형만 보고 관계를 서두름", "경쟁심으로 밀어붙임"]
brain:
  decision_rule: "연애 시작을 확인해도 장기 지속과 결혼 가능성은 상대 정보와 실제 관계 과정을 별도로 본다."
  forbidden_advice: ["유금 하나를 여성으로 단정하지 않는다.", "연애 시작을 결혼 성사로 확대하지 않는다."]
  safety_note: "새로운 만남은 확인됐지만 관계의 장기성은 미검증이다."
golden_answer: "정유년에는 자신감과 표현력이 살아나 새로운 만남을 현실적인 연애로 발전시키기 좋습니다. 다만 강한 끌림과 관계의 지속성은 다릅니다. 초반의 설렘보다 생활 방식과 가치관, 경제적 경계를 차분히 확인하세요."
