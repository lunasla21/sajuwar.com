metadata:
  id: "case_0004"
  source: "검증 상담 사례"
  case_number: 4
  title: "정유년(丁酉年): 기존 연인을 냉정하게 재평가하고 이별한 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"

pattern:
  gender: "여성"
  pillars:
    hour: "丁卯"
    day: "甲申"
    month: "庚寅"
    year: "辛亥"
  sewoon:
    year: "정유년"
    ganji: "丁酉"
  domain: "연애·이별·관계 재평가"
  tags:
    - "relationship"
    - "breakup"
    - "식상견관"
    - "관성강화"
    - "강한목"
    - "기존인연정리"

actual_event:
  before: |
    오랜 기간 교제하던 남자와 반복적인 갈등과 피로가 누적되었다.
    이전에는 넘기던 문제를 더는 용납하기 어려워졌고,
    상대를 감정보다 현실적인 기준으로 평가하기 시작했다.
  decision: "새로운 만남을 서두르지 않고 충분한 고민 끝에 기존 관계를 정리했다."
  after: |
    정유년에 교제하던 남자와 이별했다.
    이별 후에는 새로운 연애보다 자신의 삶과 방향을 재정비했으며
    관계를 끝낸 선택에 대한 후회는 크지 않았다.

judgment:
  primary_question: |
    이 사례의 핵심은 '관성이 들어오니 새 남자가 생기는가'가 아니다.
    강해진 관성이 기존 상대의 존재와 문제를 선명하게 만들 때,
    식상이 그 관계를 비판적으로 재평가하고 정리하도록 작용하는지를 판단하는 것이다.
  evidence_chain:
    - order: 1
      signal: "정유년 천간 정화(丁火)"
      interpretation: "식상이 활성화되면서 참아온 생각과 감정을 표현하고 관계의 문제를 객관화하려는 힘이 커질 수 있다."
    - order: 2
      signal: "세운 지지 유금(酉金) + 일지 신금(申金)"
      interpretation: "관성이 강해져 남자의 존재감이 커지지만, 안정감보다 통제·간섭·압박으로 체감되는지 확인한다."
    - order: 3
      signal: "식상견관(食傷見官)"
      interpretation: "자신의 판단과 표현이 상대에 대한 비판으로 이어져 작은 문제도 관계의 지속 가능성을 가르는 기준이 될 수 있다."
    - order: 4
      signal: "월지 인목(寅木) + 시지 묘목(卯木)"
      interpretation: "강한 목 기운이 자기주장과 독립 욕구를 강화하여 억압적으로 느껴지는 관계를 오래 유지하기 어렵게 할 수 있다."
    - order: 5
      signal: "관계에 대한 현실 기준의 변화"
      interpretation: "좋아하는 감정의 크기보다 앞으로 함께 갈 수 있는 사람인지가 최종 판단 기준으로 바뀌는지 본다."
  differentiated_view: |
    관성이 강해졌다고 무조건 연애운 상승이나 새 인연 유입으로 해석하지 않는다.
    관성의 증가는 상대의 존재감과 관계 문제가 함께 커지는 현상일 수 있다.
    이 사례에서는 새 인연보다 기존 관계의 재평가와 지속 가능성을 먼저 판단한다.

timing:
  jeongyu_first_half:
    signal: "기존 관계에 대한 의문과 피로가 구체적인 문제로 인식되기 시작하는 시기"
    advice: "반복 갈등의 원인과 유지·정리의 이유를 각각 적어 감정과 사실을 분리한다."
  jeongyu_second_half:
    signal: "관계에 결론을 내리거나 실제로 정리할 가능성이 높아지는 시기"
    advice: "충동적으로 통보하지 말고 안전하고 명확한 방식으로 경계를 전달한다."
  after_jeongyu:
    signal: "새 인연보다 자신의 생활과 방향을 재정비하는 시간이 중요한 시기"
    advice: "외로움을 피하려는 만남보다 생활 리듬과 관계 기준을 먼저 회복한다."

consultation:
  explanation: |
    정유년은 새 사람을 찾기보다 현재 관계를 다시 보는 흐름이 강할 수 있습니다.
    상대의 존재감이 커지는 만큼 그동안 넘겼던 통제, 간섭, 반복 갈등도 더 선명하게 보일 수 있습니다.
    지금의 답답함을 일시적인 감정으로 단정하지 말고,
    이 관계가 현실적으로 계속될 수 있는지 충분히 점검한 뒤 결정해야 합니다.
  recommended_actions:
    - "반복되는 갈등의 원인과 빈도를 사실 중심으로 기록한다."
    - "관계를 유지할 이유와 끝낼 이유를 각각 분리해 검토한다."
    - "상대와 조정 가능한 문제인지, 반복될 구조인지 확인한다."
    - "충분히 생각한 뒤 안전하고 명확한 방식으로 결론을 전달한다."
    - "이별 후에는 새로운 만남보다 생활과 관계 기준을 먼저 재정비한다."
  avoid:
    - "감정적으로 폭발하며 이별을 통보하는 행동"
    - "자존심 싸움으로 갈등을 확대하는 행동"
    - "외로움 때문에 소모적인 관계를 억지로 이어가는 선택"
    - "이별 직후 공백을 피하려고 새로운 만남을 서두르는 행동"

outcome_validation:
  matched:
    - "기존 관계에 대한 재평가"
    - "상대에 대한 피로감 증가"
    - "식상견관에 따른 갈등 심화"
    - "충동이 아닌 이성적인 이별 결정"
    - "기존 인연 정리"
    - "자유와 독립 욕구 강화"
  improvement: |
    상대방의 원국과 두 사람의 실제 갈등 패턴을 함께 확인했다면
    관계 회복 가능성과 조정 가능한 영역을 더 구체적으로 구분할 수 있었다.
    정유년 이후 새 인연의 시기까지 연결하면 장기적인 상담 완성도가 높아진다.

brain:
  decision_rule: |
    IF 정유년의 정화가 식상을 활성화하고 유금이 기존 관성을 강화하며
    원국의 강한 목 기운이 통제받는 관계에 반발한다면,
    THEN '새 인연 유입'보다 '기존 관계의 비판적 재평가와 정리 가능성'을 먼저 검토한다.
    IF 상대에 대한 감정보다 관계의 현실성과 지속 가능성을 따지는 태도가 강해진다면,
    THEN 이별 충동과 충분한 숙고 뒤의 정리 결정을 구분하여 판단한다.
  priority_rule:
    - "1순위: 식상이 참아온 생각과 표현을 밖으로 드러내는지 본다."
    - "2순위: 강화된 관성이 안정감인지 통제와 압박인지 현실 맥락에서 구분한다."
    - "3순위: 강한 목 기운과 자기주장이 관계의 억압 구조에 어떻게 반응하는지 본다."
    - "4순위: 새 인연보다 기존 관계의 지속 가능성을 먼저 판단한다."
    - "5순위: 결론을 대신 내리지 않고 숙고·대화·경계 설정의 실행 기준을 제시한다."
  consultation_strategy:
    - "관성의 강화를 곧바로 연애운 상승으로 단정하지 않는다."
    - "상대의 존재감, 통제감, 갈등 표출, 관계 결론을 단계별로 나눈다."
    - "감정이 식었다는 설명보다 판단 기준이 달라진 과정을 설명한다."
    - "관계를 유지하거나 끝내라는 명령 대신 반복 패턴과 조정 가능성을 검토하게 한다."
    - "이별 후에는 공백을 급히 채우기보다 자신의 생활과 관계 기준을 회복하도록 안내한다."
  action_guide: |
    IF 같은 갈등이 반복되지만 조정 가능성을 확인하지 않았다면 THEN 사실과 감정을 분리해 대화한다.
    IF 통제·간섭·경계 침해가 계속되고 변화 합의가 지켜지지 않는다면 THEN 안전한 정리 계획을 검토한다.
    BECAUSE 이 사례의 핵심은 관성의 유입 자체가 아니라 식상과 관성이 충돌하며 기존 관계를 현실적으로 재평가한 데 있다.
  forbidden_advice:
    - "정유년에는 반드시 헤어진다고 단정하지 않는다."
    - "관성이 강해졌으므로 무조건 새 남자가 생긴다고 해석하지 않는다."
    - "한 사람의 사주만으로 상대방의 성격이나 잘못을 확정하지 않는다."
    - "헤어져라, 결혼하라처럼 중요한 관계 결정을 대신 내리지 않는다."
    - "폭력·위협이 있는 관계에서 단순한 대화나 인내만 권하지 않는다."
  safety_note: |
    이 사례는 동일하거나 유사한 원국·운 구조에서 판단 순서를 참고하기 위한 자료다.
    실제 관계 판단은 두 사람의 상황, 반복 행동, 안전, 원국·대운·세운을 함께 확인하며
    가능성과 위험 수준으로 표현한다.

golden_answer:
  answer: |
    정유년의 핵심은 새 남자가 들어오는지가 아니라,
    기존 상대의 존재와 반복 문제가 더 선명하게 보일 때 관계를 어떤 기준으로 재평가하는지에 있습니다.
    정화의 식상은 참아온 생각을 표현하게 하고,
    신금과 유금의 강화는 상대의 존재감뿐 아니라 통제와 압박도 크게 느끼게 할 수 있습니다.
    강한 인목과 묘목은 자신의 방향과 독립성을 지키려는 힘으로 작용합니다.
    따라서 감정적인 이별 통보보다 반복 갈등이 조정 가능한지,
    앞으로도 함께 갈 수 있는 관계인지 사실과 행동을 기준으로 확인해야 합니다.
    관계를 정리한다면 공백을 급히 새 만남으로 채우기보다 자신의 생활과 관계 기준을 먼저 회복하는 것이 좋습니다.
