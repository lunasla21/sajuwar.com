metadata:
  id: "case_0013"
  source: "검증 상담 사례"
  case_number: 13
  title: "병신년 이혼 욕구는 강했지만 현실 조건이 실행을 붙잡은 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "partially_outcome_verified"
  review_status: "human_reviewed"
pattern:
  gender: "여성"
  pillars: { hour: "丙寅", day: "甲戌", month: "甲辰", year: "壬子" }
  sewoon: { current: "丙申" }
  domain: "부부 갈등·이혼 고민·거리 두기"
actual_event:
  before: "경제 문제와 갈등이 누적돼 대화가 끊기고 이혼 욕구가 강해졌다."
  decision: "자녀·재산·생활 조건 때문에 즉시 이혼하지 않고 거리를 두는 방향을 검토했다."
  after: "갈등과 이혼 욕구는 확인됐으나 실제 별거·이혼의 장기 결과는 미확인이다."
judgment:
  primary_question: "이혼하고 싶은 감정과 실제 법적·생활상 실행 가능성을 구분한다."
  evidence_chain:
    - { signal: "진술충", interpretation: "가정과 배우자 자리의 반복 충돌을 본다." }
    - { signal: "진자합", interpretation: "자녀·재산·생활 기반이 관계를 붙잡는 현실 조건으로 본다." }
    - { signal: "인술합", interpretation: "같은 공간에서 감정 소모가 커지는지 본다." }
    - { signal: "인신충", interpretation: "잠재 갈등과 이혼 욕구가 폭발하는 계기로 본다." }
consultation:
  recommended_actions: ["각자의 공간 확보", "감정 안정 후 결정", "재산·자녀 조건 점검", "상담 활용", "안전 계획 마련"]
  avoid: ["분노 속 이혼 통보", "준비 없는 가출", "같은 공간에서 반복 충돌", "과거 상처 반복 공격"]
brain:
  decision_rule: "충이 강해도 합과 현실 조건을 함께 보며, 이혼 욕구와 이혼 성립을 별도로 판단한다."
  forbidden_advice: ["충만으로 이혼을 확정하지 않는다.", "위험한 관계에서 무조건 참고 살라고 하지 않는다."]
  safety_note: "폭력·협박·통제가 있다면 운세보다 신변 안전과 전문기관 도움을 우선한다."
golden_answer: "병신년에는 관계를 끝내고 싶은 감정이 크게 올라올 수 있습니다. 그러나 자녀와 재산, 생활 조건이 복잡하게 얽혀 있어 감정과 실행은 다르게 움직일 수 있습니다. 안전을 먼저 확보하고, 거리를 둔 뒤 현실 조건을 정리한 다음 결정하세요."
