metadata:
  id: "case_0018"
  source: "검증 상담 사례"
  case_number: 18
  title: "정유년 실질 성과가 공식 승진으로 연결된 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"
pattern:
  gender: "남성"
  pillars: { hour: "戊辰", day: "甲午", month: "甲午", year: "丙寅" }
  sewoon: { current: "丁酉" }
  domain: "승진·성과 경쟁·공식 보상"
actual_event:
  before: "표현력과 활동량이 큰 경쟁자와 승진 자리를 두고 경쟁했다."
  decision: "자신의 업무를 수익과 구체적인 결과로 증명했다."
  after: "조직이 실질 성과와 안정성을 높게 평가해 최종 승진했다."
judgment:
  primary_question: "경쟁자 중 누가 조직이 원하는 성과와 공식 자리까지 더 직접적으로 연결되는지 비교한다."
  evidence_chain:
    - { signal: "정화 식상", interpretation: "기술과 업무 역량이 드러나는 흐름을 본다." }
    - { signal: "정화가 무토를 생함", interpretation: "아이디어가 실제 수익과 결과로 이어지는지 본다." }
    - { signal: "시간 무토 재성", interpretation: "주인공 가까이에 검증 가능한 결과물이 있는지 본다." }
    - { signal: "진유합", interpretation: "성과가 조직의 공식 직위와 보상으로 연결되는지 본다." }
consultation:
  recommended_actions: ["성과를 수치화", "조직 기여 정리", "평가 기준 파악", "협력 태도 유지", "승진 후 책임 준비"]
  avoid: ["말과 이미지에만 의존", "성과가 저절로 알려질 것이라 기대", "경쟁자와 감정 대립", "조직 규율 무시"]
brain:
  decision_rule: "관성의 존재만 보지 않고 식상→재성→관성으로 실질 성과가 공식 자리까지 이어지는지를 확인한다."
  forbidden_advice: ["승진을 운만으로 예정됐다고 단정하지 않는다.", "경쟁자의 능력을 폄하하지 않는다."]
  safety_note: "실제 승진은 확인됐지만 같은 구조가 모든 조직에서 같은 결과를 보장하지 않는다."
golden_answer: "정유년의 승진은 단순한 행운보다 기술과 아이디어가 눈에 보이는 성과로 연결된 결과입니다. 경쟁자의 화려함보다 조직이 확인할 수 있는 수익과 기여도를 제시한 점이 결정적이므로, 성과를 숫자와 문서로 보여주는 전략이 유리합니다."
