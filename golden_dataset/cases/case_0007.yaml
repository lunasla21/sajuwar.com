metadata:
  id: "case_0007"
  source: "상담 판단 사례"
  case_number: 7
  title: "병신년 퇴사·창업 욕구와 장기 사업 지속성을 분리한 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "advice_only_outcome_unknown"
  review_status: "human_reviewed"

pattern:
  gender: "남성"
  pillars: { hour: "乙丑", day: "甲申", month: "癸卯", year: "丁未" }
  sewoon:
    current: { year: "병신년", ganji: "丙申" }
    following: [{ year: "정유년", ganji: "丁酉" }, { year: "무술년", ganji: "戊戌" }]
  domain: "퇴사·창업·사업 지속성"
  tags: ["startup", "career", "식상", "정계충", "관성", "자금흐름"]

actual_event:
  before: "서류 업무와 조직생활에 대한 피로가 커지고 독립 사업과 새로운 제안이 매력적으로 보였다."
  decision: "상담에서는 퇴사와 창업을 보류하고 직장을 유지하며 소규모 검증을 권했다."
  after: "실제 퇴사·창업 여부와 이후 결과는 확인되지 않았다."

judgment:
  primary_question: "창업 욕구가 생기는 운과 사업으로 돈을 벌며 3~5년 유지할 수 있는 운을 분리한다."
  evidence_chain:
    - { order: 1, signal: "병화(丙火) 식상", interpretation: "독립 욕구와 자기 방식으로 일하려는 충동이 강해지는지 본다." }
    - { order: 2, signal: "원국 정화(丁火)와 계수(癸水)의 정계충", interpretation: "현재 문서·계약·시스템을 떠나고 싶은 심리가 커지는지 본다." }
    - { order: 3, signal: "세운 신금(申金) 관성", interpretation: "새 일터나 사업 기회가 실제 가치보다 매력적으로 보이는지 검증한다." }
    - { order: 4, signal: "정유년·무술년까지의 재물 흐름", interpretation: "초기 의욕 뒤 자금 압박과 정리 위험을 감당할 수 있는지 본다." }
  differentiated_view: "식상 활성화를 곧바로 창업 성공으로 해석하지 않고 시작 욕구·사업성·현금흐름·지속성을 분리한다."

consultation:
  recommended_actions:
    - "직장을 유지하며 부업이나 작은 판매로 수요를 검증한다."
    - "최소 3년의 고정비, 생활비, 운영자금을 보수적으로 계산한다."
    - "퇴사 전에 반복 매출과 손익분기점을 데이터로 확인한다."
    - "조직 안에서 경력과 고객 문제에 대한 이해를 더 축적한다."
  avoid:
    - "감정적인 사직"
    - "대출 중심의 무리한 창업"
    - "새 제안과 낙관적 매출 전망만 믿는 결정"

brain:
  decision_rule: |
    IF 식상이 퇴사·창업 욕구를 키우더라도 후속 운에서 재물의 지속성이 약하다면,
    THEN 창업 실행보다 직장 유지와 저비용 검증을 먼저 권한다.
  priority_rule: ["1순위: 퇴사 욕구의 발생 원인", "2순위: 실제 수요와 수익성", "3순위: 3~5년 현금흐름", "4순위: 철수 기준"]
  forbidden_advice:
    - "병신년에 창업하면 반드시 실패한다고 단정하지 않는다."
    - "결과 미확인 사례를 적중 사례로 표현하지 않는다."
    - "업종·자본·고정비를 확인하지 않고 퇴사 여부를 대신 결정하지 않는다."
  safety_note: "결과가 확인되지 않은 상담 판단 사례이므로 위험 가설과 검증 절차에만 활용한다."

golden_answer:
  answer: |
    지금은 사업 기회가 확정된 시기라기보다 퇴사와 독립 욕구가 강해진 시기일 수 있습니다.
    직장을 그만두기 전에 작은 규모로 고객 수요와 반복 매출을 검증하고,
    최소 3년의 운영자금과 철수 기준을 숫자로 확인해야 합니다.
