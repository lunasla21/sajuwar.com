metadata:
  id: "case_0012"
  source: "검증 상담 사례"
  case_number: 12
  title: "정유년 가게 확장과 재투자가 함께 나타난 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "partially_outcome_verified"
  review_status: "human_reviewed"
pattern:
  gender: "여성"
  pillars: { hour: "乙亥", day: "甲申", month: "壬辰", year: "辛亥" }
  sewoon: { current: "丁酉" }
  domain: "가게 확장·시설 투자·현금흐름"
actual_event:
  before: "고객과 매출이 늘어 기존 가게 규모와 시스템의 한계를 느꼈다."
  decision: "가게 규모를 확대하고 시설과 장비에 투자했다."
  after: "인지도와 매출은 상승했지만 수익 상당 부분이 재투자됐으며 정확한 순이익은 미확인이다."
judgment:
  primary_question: "사업의 성장과 개인의 현금 여유를 분리해 판단한다."
  evidence_chain:
    - { signal: "정화 식상", interpretation: "아이디어와 기술을 외부에 드러내는 실행력으로 본다." }
    - { signal: "정임합", interpretation: "구상이 계약과 권리로 구체화되는지 본다." }
    - { signal: "정화와 신금의 긴장", interpretation: "기존 사업 틀을 바꾸려는 압력으로 해석한다." }
    - { signal: "진유합", interpretation: "재물과 신뢰·사업 체계가 결합하는 흐름을 본다." }
    - { signal: "재성의 관성화", interpretation: "수익이 시설·장비·브랜드에 다시 투입되는지 확인한다." }
consultation:
  recommended_actions: ["장비별 수익성 계산", "확장비와 운영자금 분리", "단계적 투자", "매출보다 순이익 관리", "브랜드 신뢰에 투자"]
  avoid: ["매출만 믿고 일괄 투자", "개인·사업 자금 혼용", "수익 전액 시설비 투입", "외형만 고급화"]
brain:
  decision_rule: "인지도와 매출이 올라도 재투자 비중이 크면 개인 현금흐름은 긴장될 수 있다고 함께 설명한다."
  forbidden_advice: ["진유합만으로 무조건 큰돈을 번다고 단정하지 않는다.", "가게 성장과 현금 축적을 같은 결과로 쓰지 않는다."]
  safety_note: "확장은 확인됐으나 실제 투자금과 순이익은 추가 검증이 필요하다."
golden_answer: "정유년은 가게의 수준과 신뢰를 한 단계 높일 수 있는 흐름입니다. 다만 늘어난 매출이 시설과 장비로 다시 들어갈 가능성이 커, 외형의 성장과 통장의 여유는 다를 수 있습니다. 단계적으로 투자하고 운영 현금을 남겨두세요."
