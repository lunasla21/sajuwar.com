metadata:
  id: "case_0014"
  source: "검증 상담 사례"
  case_number: 14
  title: "계사년 무오월에 가게 처분 계약이 성사된 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"
pattern:
  gender: "여성"
  pillars: { hour: "甲子", day: "甲申", month: "乙巳", year: "丁酉" }
  sewoon: { current: "癸巳", key_month: "戊午" }
  domain: "가게 처분·권리금·계약"
actual_event:
  before: "가게를 내놓았지만 권리금과 조건 협상이 길어졌다."
  decision: "현실적인 조건을 조율해 계약을 진행했다."
  after: "계사년 무오월에 권리금과 조건이 합의되어 처분 계약이 성사됐다."
judgment:
  primary_question: "까다로운 협상이 계약 실패인지, 최종 합의를 위한 조정 과정인지 구분한다."
  evidence_chain:
    - { signal: "계수 인성", interpretation: "계약서·문서·도장이 움직이는 흐름으로 본다." }
    - { signal: "정계충", interpretation: "기존 영업을 멈추고 문서로 정리하는 흐름으로 본다." }
    - { signal: "사신합형", interpretation: "매수자와 결합하면서도 가격·조건 조정이 까다로운 구조로 본다." }
    - { signal: "무오월 무계합", interpretation: "재물과 문서가 결합해 계약이 완성되는 시점을 본다." }
consultation:
  recommended_actions: ["최소 수용 금액 설정", "협상 기록", "계약서 검토", "현실적인 조건 조정", "처분 후 계획 준비"]
  avoid: ["최초 희망가만 고집", "구두 약속 의존", "갈등만으로 협상 포기", "확인 없는 서명"]
brain:
  decision_rule: "충·형을 손실로만 보지 않고, 종료가 목표인 상황에서는 문서 정리와 조건 조율의 기능을 함께 본다."
  forbidden_advice: ["사신형이면 계약이 깨진다고 단정하지 않는다.", "계약 성사와 최고 가격 수령을 같은 결과로 보지 않는다."]
  safety_note: "계약 조건은 법률·세무 검토와 실제 시장가를 함께 확인한다."
golden_answer: "계사년은 미뤄졌던 가게 처분이 문서로 정리되는 흐름입니다. 협상은 까다로울 수 있지만 무오월에는 돈과 계약 조건이 맞춰질 가능성이 커집니다. 최고가만 고집하기보다 최소 수용선을 정하고 서류를 꼼꼼히 확인하는 것이 핵심입니다."
