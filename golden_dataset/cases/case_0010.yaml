metadata:
  id: "case_0010"
  source: "상담 판단 사례"
  case_number: 10
  title: "병신년 이직 욕구와 새 직장 정착 가능성을 분리한 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "advice_only_outcome_unknown"
  review_status: "human_reviewed"

pattern:
  gender: "여성"
  pillars: { hour: "庚午", day: "甲子", month: "己卯", year: "乙丑" }
  sewoon: { year: "병신년", ganji: "丙申" }
  domain: "퇴사·이직·소득 공백·조직 적응"
  tags: ["career_change", "식상견관", "오묘파", "관성", "income_risk"]

actual_event:
  before: "현재 회사에 대한 불만과 피로가 커지고 새 직장이 더 좋아 보이며 봉급을 포기하고서라도 옮기고 싶어졌다."
  decision: "상담에서는 선퇴사를 피하고 계약과 실제 조건을 확인할 때까지 현재 직장을 유지하도록 권했다."
  after: "실제 이직 여부와 새 직장 근속 결과는 확인되지 않았다."

judgment:
  primary_question: "이직 제안이 생기는지와 옮긴 뒤 소득·적응·근속이 안정적인지를 분리한다."
  evidence_chain:
    - { order: 1, signal: "병화(丙火)가 시간 경금(庚金)을 압박", interpretation: "현재 직장·상사·규칙에 대한 불만과 퇴사 욕구가 커지는지 본다." }
    - { order: 2, signal: "세운 신금(申金) 관성", interpretation: "새 직장이나 제안이 등장하되 실제보다 매력적으로 보이는지 검증한다." }
    - { order: 3, signal: "신금(申金)과 일지 자수(子水)의 연결", interpretation: "이직 문서와 기회는 생길 수 있으나 장기 정착과 구분한다." }
    - { order: 4, signal: "시지 오화(午火)와 월지 묘목(卯木)의 오묘파", interpretation: "퇴사 시 생활 기반과 봉급이 끊기거나 공백이 생길 위험을 본다." }
    - { order: 5, signal: "월간 기토(己土) 재성의 흔들림", interpretation: "새 직장의 외형보다 실제 급여·고용형태·근속 가능성을 확인한다." }
  differentiated_view: "새 관성이 들어왔다고 좋은 이직으로 단정하지 않고 제안, 계약, 소득 공백, 적응, 근속을 단계별로 평가한다."

consultation:
  recommended_actions:
    - "현재 직장을 유지한 채 이직을 탐색한다."
    - "최종 합격과 서면 계약을 확보한 뒤 퇴사한다."
    - "연봉, 수습 조건, 고용형태, 업무 범위, 상사와 팀 문화를 확인한다."
    - "감정이 가라앉은 뒤 현재 회사와 새 회사의 조건을 같은 표로 비교한다."
  avoid: ["욱하는 선퇴사", "구두 제안만 믿기", "소득 공백을 무시하기", "회사 불만만으로 결정하기", "새 직장의 이미지에 현혹되기"]

brain:
  decision_rule: |
    IF 식상이 현재 직장을 공격하고 새 관성이 제안을 만들더라도 재성과 생활 기반이 흔들린다면,
    THEN 선퇴사를 막고 서면 계약·소득·적응·근속 조건을 먼저 검증한다.
  priority_rule: ["1순위: 퇴사 욕구의 발생 구조", "2순위: 새 제안과 계약의 실체", "3순위: 소득 공백", "4순위: 조직 적합성과 근속"]
  forbidden_advice:
    - "병신년에 이직하면 반드시 실패한다고 단정하지 않는다."
    - "결과 미확인 사례를 적중 사례로 표현하지 않는다."
    - "개별 고용 조건을 확인하지 않고 무조건 잔류를 강요하지 않는다."
  safety_note: "미확인 상담 사례이므로 선퇴사 방지와 목적지 검증 규칙에만 활용한다."

golden_answer:
  answer: |
    새 직장이 보이는 것과 그곳에 안정적으로 정착하는 것은 다른 문제입니다.
    현재 회사를 먼저 그만두지 말고 최종 합격과 서면 계약을 확보한 뒤,
    실제 연봉·수습·고용형태·업무 범위·팀 문화를 확인해야 합니다.
    감정이 아닌 같은 기준표로 두 직장을 비교하는 것이 안전합니다.
