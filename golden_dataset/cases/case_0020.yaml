metadata:
  id: "case_0020"
  source: "검증 상담 사례"
  case_number: 20
  title: "정유년 승진 대신 수평 이동으로 전문성을 넓힌 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"
pattern:
  gender: "남성"
  pillars: { hour: "甲戌", day: "甲申", month: "庚午", year: "甲寅" }
  sewoon: { current: "丁酉" }
  domain: "수평 이동·부서 변경·전문성"
actual_event:
  before: "현재 부서와 업무 환경을 바꾸고 싶은 욕구가 커졌다."
  decision: "새로운 부서와 전문적인 업무를 받아들였다."
  after: "비슷한 직급으로 옆 부서에 이동했으며 급여와 직급의 큰 상승은 없었다."
judgment:
  primary_question: "새로운 자리의 등장과 수직적인 승진을 구분한다."
  evidence_chain:
    - { signal: "정화 식상", interpretation: "새 계획과 업무 변화 욕구를 본다." }
    - { signal: "정화가 경금을 자극", interpretation: "기존 부서의 틀과 환경이 바뀌는 흐름을 본다." }
    - { signal: "유금 관성", interpretation: "새 부서와 세밀한 역할이 들어오는 흐름으로 본다." }
    - { signal: "재물·직위 연결 부족", interpretation: "새 자리가 급여·직급 상승까지 이어지는지 별도로 확인한다." }
consultation:
  recommended_actions: ["새 업무 적극 학습", "전문성 강화", "이동 후 성과 문서화", "새 조직 문화 적응", "다음 승진 기반 마련"]
  avoid: ["승진이 아니라는 이유로 이동 거부", "급여만 보고 성급한 퇴사", "이전 방식만 고집", "새 업무에 소극적 대응"]
brain:
  decision_rule: "관성이 들어와도 부서·역할·직급·급여 중 무엇이 바뀌는지 구체적으로 구분한다."
  forbidden_advice: ["새 관성을 무조건 승진으로 해석하지 않는다.", "수평 이동을 실패로 단정하지 않는다."]
  safety_note: "이동의 가치는 이후 전문성·실적·보상 변화로 장기 추적한다."
golden_answer: "정유년의 변화는 위로 올라가는 승진보다 옆으로 이동하며 전문성을 넓히는 흐름에 가깝습니다. 직급과 급여가 바로 오르지 않아도 새 업무의 경험과 성과를 문서로 남기면 다음 승진의 기반이 될 수 있습니다."
