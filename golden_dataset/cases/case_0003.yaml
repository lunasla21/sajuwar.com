metadata:
  id: "case_0003"
  source: "현명역학원 상담 사례"
  case_number: 3
  title: "병신년(丙申年): 남쪽·동남쪽 이사 후 생활 흐름이 회복된 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"

pattern:
  gender: "여성"
  pillars:
    hour: "壬申"
    day: "甲午"
    month: "庚寅"
    year: "丙午"
  sewoon:
    year: "병신년"
    ganji: "丙申"
  domain: "이사·주거 기반·생활환경·방향"
  tags:
    - "relocation"
    - "residential_direction"
    - "인신충"
    - "월주"
    - "화금균형"
    - "생활기반"

actual_event:
  before: |
    기존 집에서 특별한 이유 없이 답답함과 불안감을 자주 느꼈다.
    생활환경을 바꾸고 싶은 마음이 강해졌고,
    풍수보다 사주의 운세 흐름을 기준으로 이사 방향을 상담받았다.
  decision: "병신년에 남쪽 또는 동남쪽 방향을 우선하여 거주지를 변경했다."
  after: |
    새로운 환경으로 이동한 뒤 기존의 답답함이 점차 해소되었다.
    생활에 활력이 생기고 새로운 계획을 추진할 여유가 생겼으며,
    이사는 단순한 주거 이전을 넘어 삶의 흐름을 전환하는 계기가 되었다.

judgment:
  primary_question: |
    이 사례의 핵심은 이사 여부만 판단하는 것이 아니다.
    월주가 흔들리는 이유를 읽고,
    이동 방향과 실제 생활환경 중 무엇이 안정과 활력을 회복시키는지 함께 판단한다.
  evidence_chain:
    - order: 1
      signal: "병신년 지지 신금(申金) 유입"
      interpretation: "세운의 신금이 원국 월지 인목을 직접 건드려 생활 기반의 변동 가능성을 높인다."
    - order: 2
      signal: "월지 인목(寅木) ↔ 신금(申金)의 인신충"
      interpretation: "월주가 상징하는 집·생활권·일상의 뿌리가 흔들리며 현재 공간을 바꾸고 싶은 요구가 현실화될 수 있다."
    - order: 3
      signal: "신금(申金)의 목(木) 압박"
      interpretation: "성장과 생기를 뜻하는 목의 흐름이 눌리면서 답답함과 생활 스트레스로 체감될 수 있다."
    - order: 4
      signal: "원국의 화(火)와 세운의 금(金)"
      interpretation: "금의 압박을 조절하고 목의 생장을 돕는 화의 방향성을 보완 기준으로 삼는다."
    - order: 5
      signal: "남쪽·동남쪽 방향"
      interpretation: "현명역학원 관법에서는 화의 성질을 보완하는 후보 방향으로 보고 실제 주거 조건과 함께 비교한다."
  differentiated_view: |
    인신충을 보고 단순히 '이동수가 있다'고 끝내지 않는다.
    왜 현재 공간에서 안정감을 잃는지,
    어느 방향과 환경이 오행의 불균형을 완화하는지,
    이동 뒤 생활·직장·재물 흐름이 지속 가능한지까지 연결한다.

timing:
  byeongsin_first_half:
    signal: "기존 공간에 대한 답답함과 이사 고민이 커지는 시기"
    action: "이사 목적과 가족의 필수 생활조건을 정리하고 후보 지역을 비교한다."
  byeongsin_second_half:
    signal: "실제 계약과 이동이 구체화될 가능성이 높아지는 시기"
    action: "방위뿐 아니라 계약 조건·입주일·통근·채광·소음까지 확인한다."
  after_move:
    signal: "새 환경에 적응하며 생활 리듬을 다시 만드는 시기"
    action: "수면·동선·정리·활동 습관을 함께 바꿔 공간 변화가 생활 변화로 이어지게 한다."

consultation:
  explanation: |
    병신년에는 현재 집에 대한 답답함이 커지고 생활 기반을 바꾸려는 흐름이 나타날 수 있습니다.
    이사는 긍정적인 선택이 될 수 있으며,
    현명역학원 관법에서는 남쪽과 동남쪽을 우선 후보로 봅니다.
    다만 방향 하나만으로 집을 결정하지 말고
    채광, 통풍, 소음, 통근, 가족 생활권이 실제로 더 나아지는지를 함께 확인해야 합니다.
  recommended_actions:
    - "현재 집을 기준으로 남쪽·동남쪽 후보 지역을 우선 비교한다."
    - "지도상의 방향은 직선 방위로 확인하고 출발 기준점을 명확히 기록한다."
    - "오전·오후에 각각 방문해 채광, 통풍, 소음과 주변 동선을 확인한다."
    - "가격뿐 아니라 통근, 의료, 교육, 장보기와 가족 구성원의 생활권을 평가한다."
    - "이사와 동시에 오래된 물건과 반복되던 생활 습관을 정리한다."
    - "이사 후 직장·재물·생활 만족도를 30일·90일 단위로 점검한다."
  avoid:
    - "남쪽·동남쪽이라는 이유만으로 주거 품질이 낮은 집을 선택하는 행동"
    - "현재 집을 기준으로 한 실제 방위를 확인하지 않는 행동"
    - "가격만 보고 채광·소음·통근·가족 생활권을 무시하는 선택"
    - "환경 변화의 필요성을 무조건 참고 억누르는 행동"
    - "북쪽이나 특정 방향은 누구에게나 나쁘다고 일반화하는 표현"

outcome_validation:
  status: "실제 결과 확인"
  matched:
    - "병신년 이사 욕구와 주거지 변경"
    - "기존 공간에서 느낀 답답함"
    - "남쪽·동남쪽 방향 권유"
    - "이사 후 심리적 안정감 회복"
    - "생활 활력과 새로운 계획 회복"
    - "이사가 새로운 출발의 계기가 됨"
  improvement:
    - "방향 외에 주변 입지·주거 품질·가족 구성원의 생활조건을 함께 평가해야 한다."
    - "이사 이후 직장운과 재물운의 변화를 후속 상담으로 연결해야 한다."
  missing_data_for_quantitative_review:
    - "기존 주소와 새 주소를 기준으로 계산한 정확한 이동 방위"
    - "실제 이사 월"
    - "이사 전후 주거 만족도와 통근시간 변화"

brain:
  decision_rule: |
    IF 병신년의 신금이 월지 인목과 인신충을 이루어 월주와 생활 기반을 흔든다면,
    THEN 이사 가능성과 현재 공간의 지속 가능성을 먼저 검토한다.
    IF 금의 압박을 조절할 화의 보완이 필요하다면,
    THEN 남쪽·동남쪽을 후보 방향으로 제시하되 실제 방위와 주거 품질을 함께 확인한다.
    IF 이동 후 안정감과 생활 활력이 회복되었다면,
    THEN 방향 효과만으로 단정하지 않고 공간 품질과 생활 습관 변화의 기여도도 함께 기록한다.
  priority_rule:
    - "1순위: 인신충이 월주와 실제 생활 기반을 움직이는지 본다."
    - "2순위: 현재 공간의 답답함이 주거 조건과 어떻게 연결되는지 확인한다."
    - "3순위: 남쪽·동남쪽을 보완 후보로 두고 실제 지도 방위를 계산한다."
    - "4순위: 채광·통풍·소음·통근·가족 생활권으로 후보지를 검증한다."
    - "5순위: 이사 후 직장·재물·생활 리듬의 변화를 추적한다."
  consultation_strategy:
    - "이동수, 방향, 집의 품질, 이사 후 적응을 네 단계로 나누어 설명한다."
    - "방향은 절대 명령이 아니라 사주상 우선 검토 후보로 표현한다."
    - "가족이 함께 이사하면 가족 구성원의 현실 조건과 사주 흐름도 추가로 확인한다."
    - "이사 상담을 공간 선택에서 끝내지 않고 생활 습관과 후속 운세까지 연결한다."
  action_guide: |
    IF 월주가 충을 받아 주거 기반의 변동 신호가 강하다면 THEN 이사를 현실 선택지로 검토한다.
    IF 남쪽·동남쪽 후보가 실제 생활조건까지 개선한다면 THEN 우선순위를 높인다.
    IF 방향은 맞지만 채광·안전·통근·가족 생활권이 나쁘다면 THEN 방향보다 주거 적합성을 우선한다.
    BECAUSE 이사의 성패는 방위 하나가 아니라 공간과 생활 전체가 회복되는지에 달려 있다.
  forbidden_advice:
    - "남쪽이나 동남쪽으로 가면 반드시 운이 좋아진다고 단정하지 않는다."
    - "북쪽 또는 특정 방향을 보편적으로 흉하다고 말하지 않는다."
    - "사주 방향만으로 부동산 계약을 재촉하지 않는다."
    - "불안감의 원인을 모두 집이나 운세로 돌리지 않는다."
  safety_note: |
    남쪽·동남쪽 권유와 이사 후 생활 회복이 확인된 사례다.
    다만 정확한 주소와 이동 방위, 실제 이사 월이 제공되지 않았으므로
    방향 효과의 크기를 정량화하거나 모든 유사 사주에 일반화하지 않는다.

golden_answer:
  answer: |
    병신년의 인신충은 월주와 생활 기반을 흔들어
    현재 공간을 바꾸고 싶은 마음이 실제 이사로 이어질 수 있음을 보여줍니다.
    현명역학원 관법에서는 금의 압박을 조절하고 목의 생기를 돕는
    남쪽과 동남쪽을 우선 후보로 볼 수 있습니다.
    다만 방향만 맞는 집보다 채광, 통풍, 소음, 통근과 가족 생활권이 함께 좋아지는 집을 선택해야 합니다.
    이사 후에는 공간만 옮기지 말고 오래된 물건과 생활 습관도 정리하고,
    30일과 90일 뒤 생활 안정·직장·재물 흐름을 다시 확인하는 것이 좋습니다.
