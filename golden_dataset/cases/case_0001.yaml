metadata:
  id: "case_0001"
  source: "현명역학원 상담 사례"
  case_number: 1
  title: "정유년(丁酉年): 이직보다 새 조직 적응이 더 어려웠던 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"

pattern:
  gender: "남성"
  pillars:
    hour: "庚午"
    day: "甲寅"
    month: "丙寅"
    year: "己巳"
  sewoon:
    year: "정유년"
    ganji: "丁酉"
  following_year:
    year: "무술년"
    ganji: "戊戌"
  domain: "이직·조직 적응·인간관계"
  tags:
    - "career_change"
    - "organization_fit"
    - "식상견관"
    - "사유합금"
    - "인오합"
    - "인사형"
    - "인오술화국"

actual_event:
  before: |
    기존 직장의 조직문화와 상사에 대한 불만이 커졌고,
    더 좋은 연봉과 근무조건을 제시하는 회사가 나타났다.
  decision: "정유년에 기존 회사를 퇴사하고 새로운 회사로 이직했다."
  after: |
    새 직장에서 기대했던 만족을 얻지 못했다.
    조직문화와 업무방식의 충돌, 동료 관계 스트레스가 반복되었고
    성과는 있었지만 만족도는 낮아 다시 이직을 고민하게 되었다.

judgment:
  primary_question: |
    이 사례의 핵심은 '이직에 성공하는가'가 아니다.
    왜 지금 조직을 떠나고 싶은지,
    옮긴 뒤 새로운 조직의 규율에 적응할 수 있는지를 함께 판단하는 것이다.
  evidence_chain:
    - order: 1
      signal: "정화(丁) → 시간 경금(庚)"
      interpretation: "식상견관으로 조직의 규율과 상사 권한을 답답하게 느끼고 퇴사 심리가 강해질 수 있다."
    - order: 2
      signal: "유금(酉) 유입 + 원국 사화(巳)"
      interpretation: "사유합금으로 새 조직의 규칙·절차·통제가 강화되어 자유로운 업무 방식과 충돌할 수 있다."
    - order: 3
      signal: "강한 인목(寅)과 인오합의 화 기운"
      interpretation: "직관과 열정으로 빠르게 성과를 내지만 규정 중심 환경에서는 마찰이 커질 수 있다."
    - order: 4
      signal: "인사형(寅巳刑)"
      interpretation: "내부 압박과 반복 갈등이 감정적인 결정으로 이어지는지 확인한다."
    - order: 5
      signal: "무술년(戊戌)까지의 연속 흐름"
      interpretation: "인오술 화국이 완성되면 성과는 커질 수 있으나 과열, 관계 충돌, 조직 부적응 위험도 함께 높아질 수 있다."
  differentiated_view: |
    관성이 들어왔다고 곧바로 취업운·직장운 상승으로 해석하지 않는다.
    기회의 유입과 그 조직에서 버틸 수 있는지는 별개의 문제다.
    이 사례에서는 이직 성사보다 목적지의 조직 적합성과 이직 후 적응 가능성을 먼저 본다.

timing:
  jeongyu_first_half:
    signal: "이직 충동과 더 좋은 조건에 대한 기대가 강해지는 시기"
    advice: "퇴사 결정보다 목적지 조직의 실제 문화를 확인한다."
  jeongyu_second_half:
    signal: "새 조직의 규율과 동료 관계에서 적응 스트레스가 구체화될 수 있는 시기"
    advice: "사람에 대한 즉각적 평가보다 역할·업무·의사결정 구조를 분리해 점검한다."
  musul_year:
    signal: "성과 가능성과 과열·조직 갈등 위험이 함께 커지는 시기"
    advice: "휴식, 경청, 공을 나누는 행동으로 열기를 조절한다."

consultation:
  explanation: |
    회사를 떠나고 싶은 마음 자체는 이상하지 않습니다.
    다만 지금의 불만이 현재 회사만의 문제인지,
    조직의 틀을 견디기 어려워진 시기적 압력인지 구분해야 합니다.
    조건만 보고 옮기면 새 조직에서도 같은 갈등이 반복될 수 있으므로
    연봉보다 조직 적합성과 이직 후 90일의 적응 계획을 먼저 확인해야 합니다.
  recommended_actions:
    - "퇴사 전에 보고 체계, 의사결정 권한, 피드백 방식, 평가 기준을 확인한다."
    - "면접에서 팀 이직률, 상사의 관리 방식, 자율성 범위, 갈등 해결 절차를 질문한다."
    - "연봉 외에 업무 자율성·규정 강도·협업 구조를 조직 선택 기준으로 만든다."
    - "입사 후 30·60·90일 목표를 정하고 성과와 관계 적응을 따로 관리한다."
    - "성과를 독점하지 않고 동료에게 공을 나누며 반대 의견은 문서와 대안으로 제시한다."
    - "무술년에는 휴식, 경청, 속도 조절을 의식적으로 실행한다."
  avoid:
    - "감정적인 사직"
    - "상사와의 정면충돌"
    - "조직 전체를 공개적으로 비판하는 행동"
    - "규정을 확인하지 않고 자기 방식만 밀어붙이는 행동"
    - "높은 연봉과 직함만 보고 이직하는 선택"

outcome_validation:
  matched:
    - "이직 심리 발생"
    - "더 좋은 조건에 흔들림"
    - "새 조직 적응 실패"
    - "동료 및 조직문화 갈등"
    - "성과는 있었지만 만족도는 낮음"
    - "다시 퇴사를 고민하는 흐름"
  improvement: |
    이직을 막는 조언만으로는 부족하다.
    이직을 선택할 경우를 대비해 목적지 조직의 적합성 체크리스트와
    입사 후 90일 적응 전략을 구체적으로 제시해야 상담 가치가 높아진다.

brain:
  decision_rule: |
    IF 식상견관이 퇴사 심리를 만들고 합금이 새로운 조직의 규율을 강화하며
    원국의 강한 화 기운이 그 규율과 충돌한다면,
    THEN '이직 가능성'과 '이직 후 적응 가능성'을 분리하여 판단한다.
    IF 다음 해에 화 기운이 더 강해진다면,
    THEN 단기 성과가 있더라도 관계·규정·과열의 지속 가능성을 먼저 검토한다.
  priority_rule:
    - "1순위: 현재 회사를 떠나고 싶은 심리의 발생 구조를 본다."
    - "2순위: 이직 대상 조직의 규율과 본인의 업무 방식이 맞는지 본다."
    - "3순위: 이직한 다음 해까지 성과와 적응 흐름을 연결한다."
    - "4순위: 연봉·직함보다 자율성·관리 방식·협업 구조를 비교한다."
    - "5순위: 실행한다면 90일 적응 계획까지 함께 제시한다."
  consultation_strategy:
    - "기회의 유입을 곧바로 좋은 직장운으로 단정하지 않는다."
    - "퇴사 충동, 이직 성사, 새 조직 적응, 장기 지속성을 네 단계로 나눈다."
    - "고객이 이미 이직을 결정했다면 만류보다 목적지 검증과 적응 전략을 제공한다."
    - "성과와 만족도를 분리해 설명하고 관계 리스크를 실행 행동으로 바꾼다."
  action_guide: |
    IF 목적지의 조직문화와 권한 구조가 확인되지 않았다면 THEN 결정을 서두르지 않는다.
    IF 이직을 실행한다면 THEN 입사 전 조직 적합성 확인과 입사 후 90일 적응 계획을 세운다.
    BECAUSE 이 사례의 실패 원인은 이직 자체보다 같은 충돌 구조가 새 조직에서도 반복된 데 있다.
  forbidden_advice:
    - "정유년에 이직하면 반드시 실패한다고 단정하지 않는다."
    - "관성이 들어왔으므로 무조건 취업운이 좋다고 단순 해석하지 않는다."
    - "조직 갈등을 모두 고객의 성격 탓으로 돌리지 않는다."
    - "실제 선택 조건을 확인하지 않고 퇴사 또는 잔류를 강요하지 않는다."
  safety_note: |
    이 사례는 동일하거나 유사한 구조를 해석하는 참고 근거다.
    실제 판단은 원국·대운·세운·월운과 현실의 조직 조건을 함께 확인하고,
    가능성과 위험 수준으로 표현한다.

golden_answer:
  answer: |
    정유년의 핵심은 새 기회가 들어왔다는 사실보다,
    왜 지금 조직을 떠나고 싶은지와 옮긴 뒤 그 조직의 규율에 적응할 수 있는지를 구분하는 데 있습니다.
    식상견관은 퇴사 심리를 키우고 사유합금은 새 조직의 규칙과 통제를 강화할 수 있습니다.
    원국의 강한 화 기운은 성과를 내는 힘이지만 규정 중심 문화와 부딪히면 관계 스트레스로 바뀔 수 있습니다.
    따라서 연봉만 비교하지 말고 상사의 관리 방식, 자율성, 평가 기준, 협업 구조를 먼저 확인해야 합니다.
    이직한다면 입사 후 90일 동안 성과와 관계 적응을 따로 관리하고,
    무술년에는 속도를 낮추고 경청하며 공을 나누는 전략이 필요합니다.
