metadata:
  id: "case_0017"
  source: "검증 상담 사례"
  case_number: 17
  title: "갑오년 역할과 부서는 변했지만 승진은 이루어지지 않은 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"
pattern:
  gender: "남성"
  pillars: { hour: "壬申", day: "甲辰", month: "甲午", year: "丙辰" }
  sewoon: { current: "甲午" }
  domain: "승진 경쟁·성과 분산·인사 이동"
actual_event:
  before: "승진을 기대할 만한 역할 변화가 있었고 동료와 성과 경쟁이 발생했다."
  decision: "부서와 역할 변화를 받아들였다."
  after: "성과 일부가 동료에게 돌아가고 인사이동은 있었지만 승진은 이루어지지 않았다."
judgment:
  primary_question: "조직 변화가 실제 직급과 보상의 상승으로 완성되는지 확인한다."
  evidence_chain:
    - { signal: "비겁 갑목", interpretation: "동료 경쟁과 성과 분산 가능성을 본다." }
    - { signal: "세운 갑목과 월간 갑목", interpretation: "역할과 주도권 경쟁이 강해지는 흐름으로 본다." }
    - { signal: "오오자형", interpretation: "업무 과열과 부서 환경의 불안정을 본다." }
    - { signal: "진진자형", interpretation: "노력에 비해 실질 보상과 결과가 묶이는지 본다." }
consultation:
  recommended_actions: ["성과를 수치로 기록", "업무 소유권 명확화", "보고 체계 관리", "이동을 경험 확장으로 활용", "건강 관리"]
  avoid: ["동료와 공개 충돌", "성과를 구두로만 주장", "업무 변화만으로 승진 확신", "탈락 후 성급한 퇴사"]
brain:
  decision_rule: "변화의 크기보다 직급·급여·공식 임명이라는 결과가 실제로 생기는지를 본다."
  forbidden_advice: ["자형만으로 승진 실패를 단정하지 않는다.", "동료를 원인으로 확정해 비난하지 않는다."]
  safety_note: "조직 평가와 실제 성과 자료를 함께 확인하도록 안내한다."
golden_answer: "갑오년에는 부서와 역할의 변화가 커도 그것이 곧 승진을 뜻하지는 않습니다. 경쟁 속에서 성과가 분산될 수 있으므로 기여도를 수치와 문서로 남기고, 이번 이동을 다음 평가를 위한 경력 자산으로 바꾸는 것이 중요합니다."
