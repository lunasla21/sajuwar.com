metadata:
  id: "case_0015"
  source: "상담 판단 사례"
  case_number: 15
  title: "계사년 재결합 가능성과 재결합 후 안정성을 분리한 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "advice_only_outcome_unknown"
  review_status: "human_reviewed"
pattern:
  gender: "여성"
  pillars: { hour: "甲子", day: "甲申", month: "乙巳", year: "丁酉" }
  sewoon: { current: "癸巳", key_month: "丁巳" }
  domain: "별거·재결합·관계 위험"
actual_event:
  before: "별거 중인 남편이 재결합을 요구했고 정사월에 마음이 흔들렸다."
  decision: "즉시 합가하지 않고 실제 행동 변화와 조건을 확인하도록 권했다."
  after: "실제 재결합 여부와 이후 관계 결과는 확인되지 않았다."
judgment:
  primary_question: "다시 만날 가능성과 다시 함께 살 때의 안정성을 분리한다."
  evidence_chain:
    - { signal: "사신합", interpretation: "상대가 돌아오고 감정이 다시 가까워지는 흐름으로 본다." }
    - { signal: "사신형", interpretation: "합가 후 과거의 구속·비판·갈등이 반복될 위험을 본다." }
    - { signal: "사화 속 경금", interpretation: "배우자의 존재와 요구가 다시 강해지는 계기로 본다." }
    - { signal: "정사월 사화 중첩", interpretation: "연민과 미련으로 판단이 흔들릴 수 있는 시기로 본다." }
consultation:
  recommended_actions: ["바로 합가하지 않기", "행동 변화 관찰", "경제·생활 약속 문서화", "부부상담", "안전과 경계 설정"]
  avoid: ["연민만으로 재결합", "말만 믿고 즉시 합가", "과거 문제가 저절로 사라진다고 기대", "주변 시선만으로 결정"]
brain:
  decision_rule: "합은 만남을 만들 수 있지만 형이 함께 있으면 관계 이후의 지속성과 안전을 별도로 점검한다."
  forbidden_advice: ["합이 있다고 행복한 재결합을 보장하지 않는다.", "결과 미확인 사례를 적중 사례로 쓰지 않는다."]
  safety_note: "폭력·협박·통제 이력이 있다면 재결합보다 안전 계획과 전문 지원을 우선한다."
golden_answer: "다시 만날 가능성은 있어도 다시 함께 사는 일이 곧 관계 회복을 뜻하지는 않습니다. 말보다 달라진 행동을 충분히 지켜보고, 경제와 생활 규칙을 먼저 합의하세요. 안전에 대한 우려가 있다면 합가를 서두르지 않는 것이 우선입니다."
