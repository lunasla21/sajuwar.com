metadata:
  id: "case_0016"
  source: "검증 상담 사례"
  case_number: 16
  title: "병신년 승진 후보와 업무 변화는 있었지만 최종 승진이 미뤄진 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "partially_outcome_verified"
  review_status: "human_reviewed"
pattern:
  gender: "남성"
  pillars: { hour: "甲戌", day: "甲申", month: "癸巳", year: "丙午" }
  sewoon: { current: "丙申", following: "戊戌" }
  domain: "승진 심사·부서 이동·책임 증가"
actual_event:
  before: "성과를 인정받아 승진 후보에 올랐다."
  decision: "새로운 부서와 업무를 맡으며 심사 결과를 기다렸다."
  after: "책임과 업무량은 늘었지만 병신년 최종 승진은 이루어지지 않았다. 무술년 승진 여부는 미확인이다."
judgment:
  primary_question: "후보 지명·자리 이동·책임 증가와 실제 승진을 구분한다."
  evidence_chain:
    - { signal: "병화 식상", interpretation: "실력과 성과가 드러나 후보로 거론되는 흐름을 본다." }
    - { signal: "계수 인성의 제어", interpretation: "문서·심사·최종 결재에서 지연이 생기는지 본다." }
    - { signal: "신금 관성 강화", interpretation: "자리와 책임이 커지는 흐름을 본다." }
    - { signal: "사신합형", interpretation: "부서와 업무가 복잡하게 변하지만 직급 상승과는 다를 수 있다고 본다." }
    - { signal: "무술년 무계합·오술합", interpretation: "다음 승진 가능성은 예측으로만 남기고 결과와 분리한다." }
consultation:
  recommended_actions: ["성과 문서화", "새 업무에서 실적 축적", "평가 기준 확인", "조급한 이직 자제", "다음 심사 준비"]
  avoid: ["책임 증가를 승진으로 착각", "탈락에 감정적으로 대응", "업무 변화를 불이익으로만 해석"]
brain:
  decision_rule: "관성이 들어와도 후보·이동·책임과 임명장·직급·보상 중 무엇이 실제 발생하는지 구분한다."
  forbidden_advice: ["무술년에 반드시 승진한다고 단정하지 않는다.", "후보 명단을 승진 결과로 표현하지 않는다."]
  safety_note: "병신년 결과는 확인됐지만 이후 승진 전망은 미검증 가설이다."
golden_answer: "병신년에는 성과가 드러나 승진 후보에 오를 수 있지만, 심사와 문서 과정의 제동으로 최종 직급 상승은 미뤄질 수 있습니다. 늘어난 책임을 실적으로 남기되 다음 시기의 승진은 확정이 아니라 준비해야 할 가능성으로 보세요."
