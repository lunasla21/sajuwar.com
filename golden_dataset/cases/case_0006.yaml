metadata:
  id: "case_0006"
  source: "검증 상담 사례"
  case_number: 6
  title: "임진년 유학 실행 후 계사년에 학업을 중단하고 귀국한 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"

pattern:
  gender: "남성"
  pillars: { hour: "甲戌", day: "甲寅", month: "丁卯", year: "甲子" }
  sewoon:
    start: { year: "임진년", ganji: "壬辰" }
    following: { year: "계사년", ganji: "癸巳" }
  domain: "유학·학업 지속·부동산 처분·귀국"
  tags: ["study_abroad", "인성", "정임합", "진술충", "학업중단"]

actual_event:
  before: |
    더 넓은 환경에서 공부하려는 욕구가 강해졌고 유학 비용을 마련하기 위해 집을 처분했다.
  decision: "임진년에 기대보다 낮은 가격으로 집을 처분하고 유학을 떠났다."
  after: "계사년에 계획한 학업을 마치지 못하고 거처를 정리한 뒤 귀국했다."

judgment:
  primary_question: |
    유학을 떠날 수 있는지와 학업을 끝까지 지속할 수 있는지를 분리한다.
    출국운만 보지 않고 다음 해의 재정·체류·거주 안정성까지 연결해 판단한다.
  evidence_chain:
    - { order: 1, signal: "임수(壬水) 인성", interpretation: "학문 욕구와 외국에서 공부하려는 계획이 구체화되는지 본다." }
    - { order: 2, signal: "월간 정화(丁火)와 정임합(丁壬合)", interpretation: "공부 계획이 생활 기반과 자산 처분을 동반한 현실 행동으로 이어지는지 본다." }
    - { order: 3, signal: "세운 진토(辰土)와 시지 술토(戌土)의 진술충", interpretation: "부동산 계약은 움직이지만 가격 조건이 흔들리고 급매·양보가 필요한지 확인한다." }
    - { order: 4, signal: "계사년 계수(癸水)와 정화(丁火)의 긴장", interpretation: "학업 부담이 생활 안정과 거처를 압박하여 지속 가능성이 낮아지는지 본다." }
    - { order: 5, signal: "임진년→계사년 연속 흐름", interpretation: "출국 성공과 과정 완주를 별개의 단계로 평가한다." }
  differentiated_view: |
    인성이 강하다는 이유로 유학 성공을 단정하지 않는다.
    실행 가능성, 자금 조달, 체류 안정, 다음 해의 완주 가능성을 각각 확인한다.

timing:
  imjin_jeongmi_month: { signal: "집 처분 계약과 문서 진행 가능성", advice: "급한 자금 마련보다 최저 수용 가격과 잔금 일정을 정한다." }
  imjin_year: { signal: "유학 결정과 출국 실행", advice: "출국 전 전체 비용과 중도 귀국 조건을 확보한다." }
  gyessa_year: { signal: "학업·거처의 불안정과 귀국 가능성", advice: "비자·재정·건강·주거 중 실제 위험 요인을 월별로 점검한다." }

consultation:
  recommended_actions:
    - "유학 기간과 생활비를 보수적으로 계산하고 비상자금을 별도로 둔다."
    - "집 처분의 최저 수용 가격과 계약 기한을 미리 정한다."
    - "비자, 거주, 보험, 중도 휴학과 귀국 절차를 출국 전에 확인한다."
    - "학업 중단 가능성에 대비해 귀국 후 계획을 준비한다."
  avoid:
    - "인성이 들어왔다는 이유로 학업 완주를 낙관하는 것"
    - "유학 비용을 빠듯하게 준비하는 것"
    - "다음 해의 체류 조건을 확인하지 않는 것"

outcome_validation:
  matched: ["유학 욕구 현실화", "집 처분", "기대보다 낮은 처분 금액", "임진년 출국", "계사년 학업 중단", "귀국"]
  improvement: "국가·비자·재정·건강·주거 조건을 확인해 중단 원인을 세분화해야 한다."

brain:
  decision_rule: |
    IF 인성이 유학 실행을 열고 정임합이 자산과 학업 계획을 연결하더라도 진술충이 자금 조건을 흔든다면,
    THEN 출국 가능성과 재정 지속성을 분리한다.
    IF 다음 해에 학업 기운이 생활 기반을 압박한다면,
    THEN 입학·출국 성공과 과정 완주를 별도로 평가한다.
  priority_rule:
    - "1순위: 유학 욕구가 현실 행동으로 이어지는 구조"
    - "2순위: 자금 마련 과정의 손실과 계약 조건"
    - "3순위: 다음 해까지 학업·거주·체류가 유지되는지"
    - "4순위: 중단 시 손실을 줄이는 귀국 계획"
  forbidden_advice:
    - "인성이 강하므로 반드시 학업을 마친다고 단정하지 않는다."
    - "진술충만으로 부동산 손실 금액을 확정하지 않는다."
    - "유학 중단을 실패나 의지 부족으로 규정하지 않는다."
  safety_note: "유사 구조에 판단 순서만 참고하며 실제 학교·비자·재정·건강 조건을 함께 확인한다."

golden_answer:
  answer: |
    임진년에는 유학 계획이 실제 출국으로 이어질 수 있지만 출국과 완주는 다른 문제입니다.
    집 처분은 계약 성사뿐 아니라 가격 손실을 따로 살피고,
    계사년까지 비자·재정·거주 조건이 유지되는지 확인해야 합니다.
    장기 유학이라면 비상자금과 중도 귀국 계획까지 준비해야 선택의 손실을 줄일 수 있습니다.
