metadata:
  id: "case_0005"
  source: "검증 상담 사례"
  case_number: 5
  title: "정유년(丁酉年): 생활공간을 바꾸어 부부 갈등을 완화한 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"

pattern:
  gender: "여성"
  pillars:
    hour: "丁卯"
    day: "甲申"
    month: "庚寅"
    year: "辛亥"
  sewoon:
    year: "정유년"
    ganji: "丁酉"
  domain: "부부 관계·갈등 회복·주거환경"
  tags:
    - "marriage"
    - "relationship_recovery"
    - "배우자궁"
    - "묘유충"
    - "관성강화"
    - "공간변화"

actual_event:
  before: |
    배우자와 사소한 일에도 다툼이 잦아지고 상대의 말투와 행동이 이전보다 더 거슬렸다.
    대화가 줄면서 이해보다 오해가 많아졌으나,
    이혼보다 관계를 회복할 현실적인 방법을 찾고자 상담을 요청했다.
  decision: "무리한 이사 대신 가구 교체와 배치 변경 등 집 안의 생활환경을 먼저 바꾸었다."
  after: |
    생활공간의 분위기가 달라지면서 서로에 대한 답답함이 줄었다.
    대화가 자연스럽게 늘어났고 부부 관계도 이전보다 안정되는 흐름을 보였다.

judgment:
  primary_question: |
    이 사례의 핵심은 '부부운이 나쁘다'는 결론이 아니다.
    배우자가 실제로 달라진 것인지,
    관성 강화와 충으로 배우자의 단점과 생활 스트레스를 더 예민하게 인식하는지를 구분한다.
    관계의 문제와 생활환경의 압력을 함께 보고 가장 작은 현실적 개입부터 찾는다.
  evidence_chain:
    - order: 1
      signal: "정유년 지지 유금(酉金) 유입"
      interpretation: "관성이 강화되면서 배우자의 존재감과 단점이 크게 느껴지고 사소한 자극에도 예민해질 수 있다."
    - order: 2
      signal: "일지 신금(申金) 배우자궁"
      interpretation: "강해진 금 기운이 배우자 관계에 어떻게 체감되는지 확인하되 배우자 자체가 나빠졌다고 단정하지 않는다."
    - order: 3
      signal: "시지 묘목(卯木)과 세운 유금(酉金)의 묘유충"
      interpretation: "심리적 불안과 감정 기복, 생활 리듬의 흔들림이 대화 감소와 오해 증가로 이어지는지 본다."
    - order: 4
      signal: "월지 인목(寅木)에 가해지는 압력"
      interpretation: "마음의 여유와 생활 기반이 흔들리면서 배우자에게 서운함을 쉽게 느끼는 상태인지 확인한다."
    - order: 5
      signal: "월주와 주거환경의 변화 요구"
      interpretation: "큰 이사를 단정하지 않고 가구 배치, 채광, 환기, 정리 같은 작은 공간 변화로 생활 압력을 낮출 수 있는지 판단한다."
  differentiated_view: |
    충이 있다고 곧바로 부부운 악화나 이혼으로 해석하지 않는다.
    관계 갈등이 상대의 행동, 자신의 인식 변화, 생활환경의 정체 중 어디에서 증폭되는지 분리한다.
    이 사례에서는 사람을 바꾸려 하기보다 공간과 생활 리듬을 먼저 조정하는 저위험 개입을 우선한다.

timing:
  jeongyu_first_half:
    signal: "배우자의 말과 행동에 대한 예민함과 사소한 갈등이 서서히 커지는 시기"
    advice: "갈등 직후 결론을 내리지 말고 반복되는 시간·공간·상황을 기록한다."
  jeongyu_second_half:
    signal: "생활환경을 바꿨을 때 심리와 관계의 변화가 구체적으로 나타날 수 있는 시기"
    advice: "공용 공간을 밝고 편안하게 정리하고 함께 사용하는 시간을 다시 설계한다."
  after_home_change:
    signal: "공간의 답답함이 줄면서 대화와 관계가 점차 안정될 수 있는 흐름"
    advice: "환경 개선 효과와 함께 정기적인 대화 시간과 공동 활동을 유지한다."

consultation:
  explanation: |
    정유년은 배우자가 갑자기 나빠졌다기보다,
    상대의 단점과 생활 속 불편을 더 예민하게 느낄 수 있는 시기입니다.
    관계의 결론을 서두르거나 상대를 바꾸려 하기 전에
    두 사람이 매일 머무는 공간과 생활 리듬부터 바꾸어 보는 것이 좋습니다.
    큰 이사보다 집 안의 작은 변화가 먼저이며,
    그 뒤에도 같은 갈등이 반복되는지 확인해야 합니다.
  recommended_actions:
    - "가구 배치와 동선을 바꾸어 함께 쓰는 공간의 답답함을 줄인다."
    - "채광과 환기를 개선하고 불필요한 물건을 정리한다."
    - "도배·조명·패브릭 등 부담이 작은 범위에서 분위기를 바꾼다."
    - "감정이 안정된 시간에 정기적인 대화 시간을 만든다."
    - "두 사람이 함께할 수 있는 산책·식사·취미를 생활 일정에 넣는다."
    - "환경 변화 전후의 갈등 빈도와 대화 변화를 함께 확인한다."
  avoid:
    - "감정적으로 배우자를 몰아붙이는 행동"
    - "관계 문제를 해결하려고 무리한 이사부터 추진하는 선택"
    - "현재 갈등과 관계없는 과거의 잘못을 반복해서 꺼내는 행동"
    - "답답한 집 안 분위기와 불편한 생활 동선을 계속 방치하는 것"
    - "공간만 바꾸면 모든 관계 문제가 해결된다고 단정하는 것"

outcome_validation:
  matched:
    - "배우자에 대한 예민함 증가"
    - "사소한 부부 갈등의 반복"
    - "주거환경 변화 필요"
    - "이사보다 집 안의 변화 권유"
    - "공간 변화 이후 대화와 관계 개선"
    - "심리적 안정감 회복"
  improvement: |
    공간 변화와 함께 부부가 함께하는 취미와 정기적인 대화 방법까지 제시하면 상담 효과가 높아진다.
    배우자의 원국과 실제 상호작용을 함께 확인하면 갈등 원인을 양쪽 관점에서 더 정확히 구분할 수 있다.

brain:
  decision_rule: |
    IF 정유년의 유금이 관성과 배우자궁의 체감을 강화하고 묘유충이 심리와 생활 리듬을 흔든다면,
    THEN '배우자가 나빠졌다'고 단정하기보다 인식의 예민함, 반복 갈등, 공간 압력을 분리해 판단한다.
    IF 관계를 끝낼 의사보다 회복 의사가 있고 주거환경의 정체가 갈등 상황과 겹친다면,
    THEN 큰 이사보다 집 안의 작은 변화와 대화 구조 조정을 먼저 실행한다.
  priority_rule:
    - "1순위: 실제 배우자의 행동 변화와 사용자의 인식 변화를 구분한다."
    - "2순위: 배우자궁과 관성 강화가 안정감인지 압박감인지 현실 상황에서 확인한다."
    - "3순위: 묘유충과 월주의 압력이 생활공간·리듬·대화에 어떻게 나타나는지 본다."
    - "4순위: 이사보다 작고 되돌릴 수 있는 공간 변화부터 제안한다."
    - "5순위: 공간 변화 뒤에도 반복되는 갈등은 대화·경계·상호작용 문제로 다시 평가한다."
  consultation_strategy:
    - "부부 갈등을 길흉이나 이혼 가능성만으로 설명하지 않는다."
    - "사람, 인식, 공간, 생활 리듬의 네 층으로 원인을 나눈다."
    - "관계 회복 의사를 먼저 확인하고 가장 작은 현실적 개입을 제시한다."
    - "환경 개선과 대화·공동 활동을 함께 설계한다."
    - "변화 전후를 비교하여 효과가 없으면 부부 상담 등 다른 도움을 검토한다."
  action_guide: |
    IF 사소한 갈등이 특정 공간과 시간대에 반복된다면 THEN 생활 동선과 공용 공간부터 조정한다.
    IF 공간 변화 뒤에도 모욕, 통제, 경계 침해가 반복된다면 THEN 관계 문제로 분리해 대화와 전문적인 도움을 검토한다.
    BECAUSE 이 사례의 핵심은 공간이 모든 문제의 원인이라는 뜻이 아니라,
    운에서 커진 예민함과 생활 압력을 낮추는 첫 개입으로 공간 변화가 유효했다는 데 있다.
  forbidden_advice:
    - "정유년에는 부부 사이가 반드시 나빠진다고 단정하지 않는다."
    - "집을 바꾸면 모든 관계 문제가 해결된다고 약속하지 않는다."
    - "이혼 또는 관계 유지를 대신 결정하지 않는다."
    - "배우자의 원국과 행동을 확인하지 않고 상대방 탓으로 확정하지 않는다."
    - "폭력·위협·강압이 있는 관계에서 인테리어나 인내만 권하지 않는다."
  safety_note: |
    이 사례는 동일하거나 유사한 구조에서 판단 순서와 저위험 개입을 참고하기 위한 자료다.
    실제 판단은 두 사람의 행동, 안전, 주거환경, 원국·대운·세운을 함께 확인하고
    가능성과 조건으로 표현한다.

golden_answer:
  answer: |
    정유년의 핵심은 배우자가 갑자기 달라졌다는 결론보다,
    유금의 강화와 묘유충 속에서 상대의 단점과 생활 스트레스를 더 예민하게 느끼는지 구분하는 데 있습니다.
    먼저 갈등이 반복되는 공간과 시간, 생활 동선을 확인하고
    큰 이사보다 가구 배치, 채광, 환기, 정리처럼 작고 되돌릴 수 있는 변화를 시도하는 것이 좋습니다.
    공간을 바꾼 뒤에는 대화 시간과 공동 활동을 함께 늘리고 갈등 빈도가 실제로 줄었는지 확인해야 합니다.
    변화 뒤에도 모욕이나 통제, 경계 침해가 계속된다면 단순한 공간 문제가 아니므로
    관계의 상호작용과 안전을 별도로 점검해야 합니다.
