metadata:
  id: "case_0009"
  source: "검증 상담 사례"
  case_number: 9
  title: "갑오년 직장 구설과 동료 갈등이 권고사직으로 이어진 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "outcome_verified"
  review_status: "human_reviewed"

pattern:
  gender: "남성"
  pillars: { hour: "癸酉", day: "甲戌", month: "己卯", year: "乙巳" }
  sewoon: { year: "갑오년", ganji: "甲午" }
  domain: "직장 구설·동료 경쟁·권고사직"
  tags: ["career", "gossip", "recommended_resignation", "비겁", "갑기합", "오술합"]

actual_event:
  before: "동료와의 관계가 악화되고 자신의 성과와 몫이 다른 사람에게 돌아간다는 불만과 구설이 커졌다."
  decision: "스스로 퇴사를 고민하던 중 회사의 권고사직을 받아 직장을 떠났다."
  after: "갑오년에 동료 갈등과 업무 성과 관련 구설이 실제 고용 종료로 이어졌다."

judgment:
  primary_question: "단순한 구설인지, 경쟁이 보상과 직위까지 흔들어 고용 위험으로 이어지는지 재성과 관성을 함께 본다."
  evidence_chain:
    - { order: 1, signal: "세운 비겁 갑목(甲木)", interpretation: "동료 경쟁과 주도권 다툼이 커지는지 본다." }
    - { order: 2, signal: "갑목과 월간 기토(己土)의 갑기합", interpretation: "보상·수입·성과의 몫이 경쟁 관계로 이동하는지 확인한다." }
    - { order: 3, signal: "연간 을목(乙木)", interpretation: "동료 관계의 오해와 구설이 입지를 약화시키는지 본다." }
    - { order: 4, signal: "오화(午火)와 일지 술토(戌土)의 오술합", interpretation: "과열된 업무·감정이 관성 유금의 지위와 명예를 압박하는지 본다." }
    - { order: 5, signal: "관성 유금(酉金)의 손상", interpretation: "구설이 직위 약화와 권고사직 위험으로 번지는지 판단한다." }
  differentiated_view: "비겁을 동료 도움으로만 보지 않고 재성과 관성의 손상 여부를 함께 확인해 경쟁·보상·고용 위험을 연결한다."

consultation:
  recommended_actions:
    - "업무 지시, 산출물, 성과와 피드백을 문서로 남긴다."
    - "동료 비판과 소문 대응을 줄이고 공식 채널로 사실을 정리한다."
    - "이력서를 갱신하고 비상생활비와 이직 계획을 준비한다."
    - "권고사직 제안이 오면 사유·조건·서류를 확인한다."
  avoid: ["공개적인 동료 비판", "감정적인 사표", "소문에 직접 맞대응", "성과를 과도하게 주장", "고용 위험을 무시"]

outcome_validation:
  matched: ["동료 경쟁", "직장 구설", "보상 불만", "퇴사 고민", "고용 안정 약화", "권고사직"]
  improvement: "공식 사유와 시기를 확인하고 퇴사 후 재취업 전략까지 연결해야 한다."

brain:
  decision_rule: |
    IF 비겁이 재성의 몫을 흔들고 과열된 화 기운이 관성을 압박하며 실제 구설이 반복된다면,
    THEN 인간관계 불편을 넘어 보상·직위·고용 안정 위험까지 단계적으로 평가한다.
  priority_rule: ["1순위: 동료 경쟁과 구설", "2순위: 보상·성과 귀속", "3순위: 관성과 고용 안정", "4순위: 기록·재정·이직 대비"]
  forbidden_advice:
    - "갑오년이면 반드시 해고된다고 단정하지 않는다."
    - "모든 동료를 경쟁자나 가해자로 규정하지 않는다."
    - "노동법·계약 조건을 확인하지 않고 사직을 권하지 않는다."
  safety_note: "실제 고용 결정은 회사 문서와 노동 조건을 확인하며 필요하면 노무 전문가의 도움을 받도록 안내한다."

golden_answer:
  answer: |
    동료 갈등이 말의 문제에만 머무는지, 보상과 직위까지 흔드는지 구분해야 합니다.
    지금은 업무 지시와 성과를 문서로 남기고 공개적인 대응을 줄이는 것이 우선입니다.
    동시에 권고사직 가능성에 대비해 이력서, 생활비, 공식 사유와 조건을 확인해야 합니다.
