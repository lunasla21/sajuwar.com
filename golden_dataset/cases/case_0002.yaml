metadata:
  id: "case_0002"
  source: "현명역학원 관법 사례"
  case_number: 2
  title: "병신년(丙申年): 가게는 처분되지만 희망 금액은 조정이 필요한 사례"
  verification_status: "interpretation_reviewed_outcome_unverified"
  review_status: "human_reviewed"

pattern:
  gender: "여성"
  pillars:
    hour: "壬申"
    day: "甲午"
    month: "庚寅"
    year: "丙午"
  sewoon:
    year: "병신년"
    ganji: "丙申"
  domain: "가게 처분·권리금·계약 시기"
  tags:
    - "business_sale"
    - "contract"
    - "premium_price"
    - "식상"
    - "관성"
    - "인성"
    - "월운"

judgment:
  primary_question: |
    이 사례의 핵심은 가게가 팔리는지 하나만 보는 것이 아니다.
    처분을 실행하게 되는 흐름, 계약이 구체화되는 달,
    희망 권리금과 실제 합의 금액의 차이를 분리하여 판단한다.
  evidence_chain:
    - order: 1
      signal: "인월(寅月)의 갑목(甲木)"
      interpretation: "초봄의 생장력처럼 새로운 계획을 밀어붙이는 성향과 변화 의지가 강하게 작동한다."
    - order: 2
      signal: "병신년 천간 병화(丙火)"
      interpretation: "식상인 병화가 원국의 병화를 깨워 새로운 계획과 실행 욕구를 현실 행동으로 끌어낸다."
    - order: 3
      signal: "병화(丙火) → 월간 경금(庚金)"
      interpretation: "새 계획이 현재 일터와 가게를 상징하는 경금을 압박해 기존 자리를 정리하고 떠나려는 마음을 강화한다."
    - order: 4
      signal: "경금(庚金) → 일간 갑목(甲木) → 시간 임수(壬水)"
      interpretation: "변화 압력이 일간을 움직이고 문서·도장을 상징하는 인성까지 연결되므로 생각이 계약 행동으로 이어질 가능성을 본다."
    - order: 5
      signal: "임진월·병신월·정유월"
      interpretation: "연운의 처분 흐름이 월운에서 문서 이동과 계약 소식으로 구체화되는 후보 시점이다."
    - order: 6
      signal: "병신월·정유월의 강한 금 기운"
      interpretation: "계약과 자리 이동 가능성은 높이지만, 매도자의 희망 가격을 그대로 보존하는 신호와는 구분한다."
  differentiated_view: |
    계약 가능성과 희망 금액 수령 가능성을 같은 결론으로 묶지 않는다.
    문서 이동이 강해도 가격 협상에서는 양보가 필요할 수 있다.
    따라서 '팔린다/안 팔린다'보다
    어느 달에 어떤 금액 조건을 수용해야 계약이 성립하는지를 중심으로 판단한다.

timing:
  imjin_month:
    signal: "문의·협상·계약 소식이 시작될 수 있는 후보 시점"
    action: "매수 희망자의 조건과 실제 회수 가능 금액을 비교한다."
  byeongsin_month:
    signal: "연운과 월운이 반복되고 금 기운이 강해져 문서 이동이 구체화될 수 있는 시점"
    action: "희망가 고수보다 계약 성립 조건과 잔금 안전성을 우선한다."
  jeongyu_month:
    signal: "금 기운이 이어져 최종 협상·도장·인계가 구체화될 수 있는 시점"
    action: "가격 조정의 하한선을 미리 정하고 인계 조건을 문서화한다."

consultation:
  explanation: |
    병신년에는 가게를 정리하고 새로운 곳으로 움직이려는 생각이
    단순한 고민에서 실제 계약 행동으로 이어질 가능성이 있습니다.
    다만 계약이 열린다는 것과 원하는 권리금을 모두 받는다는 것은 다른 문제입니다.
    희망 금액만 고수하면 처분 시기가 늦어질 수 있으므로
    반드시 받아야 할 금액과 빠른 처분을 위해 양보할 수 있는 금액을 나누어 정해야 합니다.
  recommended_actions:
    - "희망가·목표가·최저 수용가의 세 구간을 미리 정한다."
    - "권리금, 보증금, 시설비, 재고, 중개비를 분리해 실제 회수액을 계산한다."
    - "임진월에는 문의와 협상 조건을 수집하고 성급히 최종가를 확정하지 않는다."
    - "병신월과 정유월에는 가격보다 계약금·잔금일·인계 범위의 안전성을 함께 본다."
    - "가격을 낮추는 대신 잔금 기간 단축, 원상복구 면제, 재고 인수 등 다른 조건을 협상한다."
    - "구두 약속은 피하고 시설 목록과 인계 책임을 계약서에 명확히 적는다."
  avoid:
    - "처음 희망한 권리금만 고집해 유효한 매수자를 놓치는 행동"
    - "총액만 보고 중개비·세금·철거비 등 실제 비용을 빼지 않는 계산"
    - "계약 가능 월을 계약 확정으로 단정하는 태도"
    - "급한 마음에 계약금과 잔금 조건을 확인하지 않는 행동"
    - "구두 약속만 믿고 시설·재고·원상복구 범위를 넘기는 행동"

outcome_validation:
  status: "실제 계약 결과 미제공"
  needed_for_validation:
    - "실제 계약 성사 여부"
    - "최초 희망 금액"
    - "최종 합의 금액"
    - "계약금과 잔금이 오간 월"
    - "협상 과정에서 조정된 조건"

brain:
  decision_rule: |
    IF 병신년의 병화가 원국의 식상과 현재 일터를 자극하고
    그 흐름이 임수 인성의 문서 작용까지 연결된다면,
    THEN 가게 처분 생각이 실제 협상과 계약 행동으로 이어질 가능성을 검토한다.
    IF 계약을 여는 금 기운은 강하지만 재성의 보존 근거가 충분하지 않다면,
    THEN 계약 성사 가능성과 희망 금액 실현 가능성을 분리하고 가격 조정 범위를 제시한다.
  priority_rule:
    - "1순위: 가게를 정리하려는 생각이 실제 행동으로 이어지는 구조인지 본다."
    - "2순위: 연운에서 열린 사건이 어느 월운에 문서와 계약으로 구체화되는지 본다."
    - "3순위: 계약 성사와 희망 금액 보존을 별도로 판단한다."
    - "4순위: 총 권리금보다 비용을 뺀 실제 회수액을 계산한다."
    - "5순위: 가격 양보가 필요하면 잔금·인계·원상복구 조건으로 보완한다."
  consultation_strategy:
    - "매각 여부, 계약 시기, 예상 금액, 계약 안전성을 네 단계로 나누어 설명한다."
    - "계약 가능 월은 확정일이 아니라 협상과 문서 이동이 강해지는 후보 구간으로 표현한다."
    - "가격을 낮추라는 말에서 끝내지 않고 희망가·목표가·최저가를 정하게 한다."
    - "권리금 손실만 강조하지 않고 빠른 처분으로 확보되는 시간과 비용도 함께 비교한다."
  action_guide: |
    IF 계약 문의가 들어와도 희망가와 최저 수용가가 정리되지 않았다면 THEN 먼저 순회수액을 계산한다.
    IF 가격을 조정해야 계약이 성립한다면 THEN 금액만 양보하지 말고 잔금일, 시설 인수, 원상복구 조건을 함께 교환한다.
    BECAUSE 이 사례의 핵심은 높은 금액을 끝까지 고수하는 것이 아니라
    실제로 남는 금액과 다음 출발의 속도를 함께 최적화하는 데 있다.
  forbidden_advice:
    - "병신년에 반드시 가게가 팔린다고 단정하지 않는다."
    - "특정 월에 무조건 계약된다고 확정하지 않는다."
    - "근거 없이 정확한 매각 금액이나 할인율을 제시하지 않는다."
    - "법률·세무 검토 없이 계약서가 안전하다고 보증하지 않는다."
  safety_note: |
    실제 계약 결과가 제공되지 않은 관법 사례다.
    유사 사주에 적용할 때는 원국·대운·세운·월운과
    상권, 임대차 조건, 시세, 계약 당사자의 현실 조건을 함께 확인한다.

golden_answer:
  answer: |
    병신년에는 가게를 떠나려는 생각이 실제 협상과 계약 행동으로 이어질 가능성이 있습니다.
    임진월에는 문의와 조건 조율을 시작하고,
    병신월과 정유월에는 문서 이동과 최종 협상이 구체화되는 흐름을 살펴볼 수 있습니다.
    다만 계약 가능성이 높아지는 것과 희망 권리금을 모두 받는 것은 별개의 문제입니다.
    희망가·목표가·최저 수용가를 미리 정하고,
    가격을 조정할 때는 잔금 기간, 시설 인수, 원상복구 조건을 함께 협상해야 합니다.
    조금 낮은 금액이라도 실제 순회수액과 다음 출발의 속도가 좋아진다면
    그것이 더 유리한 계약일 수 있습니다.
