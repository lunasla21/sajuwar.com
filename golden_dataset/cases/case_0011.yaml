metadata:
  id: "case_0011"
  source: "검증 상담 사례"
  case_number: 11
  title: "병신년 수요 증가가 사업 확장으로 이어진 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "partially_outcome_verified"
  review_status: "human_reviewed"
pattern:
  gender: "남성"
  pillars: { hour: "丙寅", day: "甲午", month: "庚辰", year: "乙巳" }
  sewoon: { current: "丙申", following: "戊戌" }
  domain: "사업 확장·이전·현금흐름"
actual_event:
  before: "고객과 물량이 늘어 기존 공간과 운영 체계로 감당하기 어려웠다."
  decision: "병신년에 사업장 이전 또는 분점 개설 방식으로 규모를 확대했다."
  after: "확장 실행은 확인됐으나 무술년의 순이익과 지출 규모는 추가 검증이 필요하다."
judgment:
  primary_question: "단순한 확장 충동인지, 검증된 수요가 공간의 한계를 밀어낸 것인지 구분한다."
  evidence_chain:
    - { signal: "병화 식상 중첩과 인오합", interpretation: "상품·서비스의 반응과 실행력이 실제로 커지는 흐름을 본다." }
    - { signal: "병화가 경금을 제어", interpretation: "경쟁과 거래 관계에서 주도권을 확보하는지 확인한다." }
    - { signal: "인신충", interpretation: "실제 수요 증가와 함께 나타날 때 기존 공간의 한계를 깨는 이동 압력으로 본다." }
    - { signal: "신금과 진토의 연결", interpretation: "계약·사업권·공간이 사업 자산으로 전환되는지 본다." }
    - { signal: "무술년 진술충", interpretation: "매출 증가와 시설비·인건비 증가를 함께 점검한다." }
consultation:
  recommended_actions: ["고객·물량·재구매율 검증", "확장비와 1년 운영자금 분리", "단계적 확장", "업무 시스템화", "계약서 검토"]
  avoid: ["매출만 보고 과대 확장", "수익 전액 재투자", "과도한 대출", "인력과 체계 없는 외형 확장"]
brain:
  decision_rule: "확장운은 충 하나로 정하지 않는다. 실제 수요, 공간 부족, 계약 가능성, 다음 운의 현금흐름이 함께 맞을 때만 긍정한다."
  forbidden_advice: ["인신충이면 반드시 확장한다고 단정하지 않는다.", "매출 증가를 순이익 증가로 표현하지 않는다."]
  safety_note: "확장 실행은 확인됐지만 이후 수익성은 부분 검증이므로 자금 위험을 별도로 경고한다."
golden_answer: "병신년의 확장은 욕심보다 늘어난 고객과 물량이 만든 현실적인 압력에 가깝습니다. 다만 다음 흐름에는 매출과 지출이 함께 커질 수 있으니, 확장비와 운영자금을 분리하고 단계적으로 넓히는 전략이 필요합니다."
