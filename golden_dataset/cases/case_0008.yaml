metadata:
  id: "case_0008"
  source: "상담 판단 사례"
  case_number: 8
  title: "정유년 집·가게 이전으로 재물 누수를 조정하려 한 사례"
  privacy: "생년월일·출생지 비공개"
  verification_status: "advice_only_outcome_unknown"
  review_status: "human_reviewed"

pattern:
  gender: "남성"
  pillars: { hour: "辛未", day: "甲戌", month: "乙卯", year: "戊午" }
  sewoon: { year: "정유년", ganji: "丁酉" }
  domain: "사업장 이전·주거 이전·재물 누수"
  tags: ["business_move", "cashflow", "묘유충", "술미형", "재성"]

actual_event:
  before: "매출이 있어도 돈이 남지 않고 집과 사업장의 지출이 얽혀 운영이 정체되었다."
  decision: "상담에서는 집과 가게 이전을 함께 검토하고 생활비와 사업비를 분리하도록 권했다."
  after: "실제 이전 여부와 이전 전후의 매출·임대료·순이익은 확인되지 않았다."

judgment:
  primary_question: "겉매출이 아니라 순현금흐름을 보고, 충·형이 이동 신호인지 비용 구조의 경고인지 현실 조건과 함께 판단한다."
  evidence_chain:
    - { order: 1, signal: "정화(丁火)와 신금(辛金)의 긴장", interpretation: "현재 운영 방식과 시스템이 성과를 보존하지 못하는지 본다." }
    - { order: 2, signal: "신금→을목→무토의 연쇄 압력", interpretation: "생활 기반과 사업비가 얽혀 최종적으로 재물 누수가 커지는지 본다." }
    - { order: 3, signal: "묘유충(卯酉沖)", interpretation: "주거·생활 기반의 이동 또는 구조 변경 필요성을 확인한다." }
    - { order: 4, signal: "술미형(戌未刑)", interpretation: "사업장이 제 기능을 못하거나 고정비가 운영을 압박하는지 본다." }
  differentiated_view: "충과 형을 무조건 파괴로 보지 않되, 이동만으로 개선된다고 단정하지 않고 입지·임대료·순이익을 검증한다."

consultation:
  recommended_actions:
    - "집과 사업의 계좌·예산·지출 항목을 분리한다."
    - "이전 전후 임대료, 유동 인구, 예상 매출, 손익분기점을 비교한다."
    - "계약 전에 작은 테스트와 상권 데이터를 확인한다."
    - "추가 대출보다 반복 지출과 재물 누수를 먼저 줄인다."
  avoid: ["현재 자리에서 무조건 버티기", "매출만 보고 순이익을 무시하기", "근거 없이 집과 가게를 동시에 옮기기", "추가 대출로 손실 메우기"]

brain:
  decision_rule: |
    IF 묘유충과 술미형이 생활 기반과 사업장을 함께 흔들고 실제 현금흐름도 악화되어 있다면,
    THEN 이동을 하나의 대안으로 검토하되 이전 비용·입지·순이익 개선 가능성을 숫자로 확인한다.
  priority_rule: ["1순위: 매출과 순이익의 차이", "2순위: 생활비·사업비 누수", "3순위: 현 자리와 새 자리의 비용 비교", "4순위: 이동 후 운영 계획"]
  forbidden_advice:
    - "이사하면 반드시 재물이 좋아진다고 단정하지 않는다."
    - "결과 미확인 사례를 적중 사례로 표현하지 않는다."
    - "상권과 계약 조건 없이 특정 이동을 강요하지 않는다."
  safety_note: "미확인 상담 사례이므로 이동 가설을 현실 데이터로 검증하는 방식에만 활용한다."

golden_answer:
  answer: |
    현재의 핵심은 매출보다 돈이 어디에서 새는지 확인하는 것입니다.
    집과 가게 이전은 가능성 중 하나지만 새 자리의 임대료, 유동 인구, 이전 비용과 순이익을 먼저 비교해야 합니다.
    생활비와 사업비를 분리하고 이동 후 실제 현금흐름이 개선되는 경우에만 실행하는 것이 안전합니다.
